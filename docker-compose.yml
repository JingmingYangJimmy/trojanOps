services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trojanops
    ports:
      - "5432:5432"
    volumes:
      - trojanops-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trojanops"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  trojanops-db:
